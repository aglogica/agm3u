<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgM3U Player</title>
    <!-- Hls.js Bibliothek für das Abspielen von .m3u8 IPTV Streams laden -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1c1c1f;
            --border-color: #3f3f46;
            --text-color: #e3e3e6;
            --accent-color: #ef4444;
            --tab-inactive: #2a2a30;
            --menu-bg: #2a2a30;
            --control-height: 32px;
        }

        body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; box-sizing: border-box; font-family: sans-serif; margin: 0; padding: 5px 15px 15px; background: var(--bg-color); color: var(--text-color); user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        input, textarea, [contenteditable="true"] { user-select: text; -webkit-user-select: text; -webkit-touch-callout: default; }
        
        /* Flex Header mit Titel links, Timer-Status und Kebab rechts */
        .header-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; border-bottom: 1px solid var(--border-color); padding-bottom: 0; position: relative; }
        .header-title { font-size: 1.0rem; font-weight: bold; line-height: 1.1; color: #fff; margin: 0; }
        .current-stream-info { appearance: none; -webkit-appearance: none; min-height: 1.2em; margin: 0 0 6px; padding: 4px 8px; border: 0; background: transparent; color: #a1a1aa; font: inherit; font-size: 0.8rem; line-height: 1.2; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
        .current-stream-info.is-playing { border-radius: 6px; background: var(--accent-color); color: #fff; }
        .current-stream-info:disabled { opacity: 1; cursor: default; }
        
        .header-controls { display: flex; align-items: center; gap: 12px; }
        .status-container { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
        
        #timerStatus, #shuffleStatus { font-size: 0.9rem; color: #a1a1aa; padding: 4px 6px; border-radius: 4px; cursor: pointer; transition: background 0.2s; user-select: none; display: flex; align-items: center; gap: 4px; }
        #timerStatus:hover, #shuffleStatus:hover { background: rgba(255, 255, 255, 0.1); }
        
        @keyframes timerBlink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        .timer-paused { animation: timerBlink 1.5s infinite; color: #f59e0b !important; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .icon-spin { display: inline-block; /*animation: spin 4s linear infinite;*/ }
        @keyframes flip { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(-1); } }
        .icon-flip { display: inline-block; /*animation: flip 2s ease-in-out infinite;*/ }
        
        .kebab-btn { background: none; border: none; cursor: pointer; padding: 4px; outline: none; display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: background 0.2s; z-index: 101; }
        .kebab-btn svg { fill: var(--accent-color); width: 20px; height: 20px; }
        .kebab-btn:hover { background: rgba(239, 68, 68, 0.1); }
        
        .dropdown-menu { display: none; position: absolute; top: calc(100% + 5px); right: 0; background: var(--menu-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; box-shadow: 0 10px 15px rgba(0,0,0,0.5); z-index: 105; min-width: 280px; box-sizing: border-box; }
        .dropdown-menu.show { display: block !important; }
        .menu-title { font-size: 0.9rem; font-weight: bold; margin: 0 0 12px 0; color: #fff; border-bottom: 1px solid var(--border-color); padding-bottom: 6px; }
        .menu-label { display: block; font-size: 0.8rem; color: #a1a1aa; margin-bottom: 5px; text-align: left; }
        
        .timer-input-row { display: flex; gap: 6px; margin-bottom: 12px; width: 100%; }
        .timer-number-input { flex-grow: 1; padding: 8px; border-radius: 6px; border: 1px solid var(--border-color); background: #2a2a30; color: #fff; text-align: center; font-size: 0.9rem; }
        .timer-set-btn { background: var(--accent-color); color: #fff; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: bold; }
        .timer-set-btn:hover { background: #dc2626; }
        .wake-lock-status { min-height: 1.2em; margin: -6px 0 12px; color: #a1a1aa; font-size: 0.75rem; line-height: 1.4; }
        
        input[type="file"] { width: 100%; }
        input[type="file"]::file-selector-button { background: #2a2a30; color: #fff; border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 6px; cursor: pointer; width: 100%; margin-bottom: 10px; }
        #fileNameDisplay { display: block; font-size: 0.85rem; color: #a1a1aa; font-style: italic; word-break: break-all; margin-bottom: 5px; }
        
        /* Suchleiste */
        .search-container { flex: 0 0 auto; margin-bottom: 0; width: 100%; }
        #searchBar { width: 100%; height: var(--control-height); padding: 0 12px; border-radius: 8px; border: 1px solid var(--accent-color); background: rgba(239, 68, 68, 0.14); color: #fff; box-sizing: border-box; }
        #searchBar:focus { outline: 2px solid rgba(239, 68, 68, 0.35); outline-offset: 1px; }

        .radio-search-form { display: flex; flex: 0 0 auto; gap: 8px; height: var(--control-height); margin-top: 8px; }
        #radioSearchInput { flex: 1; min-width: 0; height: 100%; padding: 0 12px; border-radius: 8px; border: 1px solid var(--accent-color); background: rgba(239, 68, 68, 0.14); color: #fff; box-sizing: border-box; }
        #radioSearchInput:focus { outline: 2px solid rgba(239, 68, 68, 0.35); outline-offset: 1px; }
        #radioSearchButton { height: 100%; }
        .radio-search-btn { height: var(--control-height); padding: 0 16px; border: none; border-radius: 8px; background: var(--accent-color); color: #fff; font-weight: bold; cursor: pointer; box-sizing: border-box; }
        .radio-search-btn:disabled, .radio-insert-btn:disabled, .radio-insert-all-btn:disabled { opacity: 0.6; cursor: wait; }
        .radio-search-status { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
        .radio-results { list-style: none; padding: 0; margin: 0; }
        .radio-station { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 5px 12px; margin-bottom: 5px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--card-bg); position: relative; }
        .radio-station.menu-open { z-index: 10; }
        .radio-station.is-playing { background: var(--accent-color); border-color: var(--accent-color); }
        .radio-station.is-playing .radio-station-details { color: #fff; }
        .radio-station.is-paused { background: #5b3b24; border-color: #8b5e3c; }
        .radio-station.is-paused .radio-station-details { color: #f0d7c2; }
        .radio-station-info { min-width: 0; }
        .radio-station-info[role="button"] { cursor: pointer; }
        .radio-station-name { display: -webkit-box; color: #fff; font-weight: bold; overflow-wrap: anywhere; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
        .radio-station-details { display: block; margin-top: 3px; color: #a1a1aa; font-size: 0.8rem; overflow-wrap: anywhere; }
        .radio-station-menu { display: none; position: absolute; z-index: 20; top: calc(100% - 4px); left: 8px; width: min(280px, calc(100% - 16px)); padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--menu-bg); box-shadow: 0 10px 15px rgba(0,0,0,0.5); box-sizing: border-box; }
        .radio-station-menu.show { display: block; }
        .radio-station-menu-title { margin: 0 0 8px; padding: 2px 4px 8px; border-bottom: 1px solid var(--border-color); color: #fff; font-size: 0.9rem; font-weight: bold; overflow-wrap: anywhere; }
        .radio-insert-btn, .radio-insert-all-btn, .radio-info-btn, .radio-homepage-btn { width: 100%; padding: 9px 10px; border: 0; border-radius: 6px; background: transparent; color: #e3e3e6; text-align: left; cursor: pointer; }
        .radio-insert-btn:hover:not(:disabled), .radio-insert-all-btn:hover:not(:disabled), .radio-info-btn:hover, .radio-homepage-btn:hover { background: rgba(255,255,255,0.1); }
        .radio-insert-btn:disabled, .radio-insert-all-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .radio-insert-btn { transition: background 0.2s, border-color 0.2s, color 0.2s, transform 0.2s; }
        .radio-insert-btn.is-inserted { background: #166534; color: #dcfce7; }
        .radio-insert-btn.is-inserted svg { animation: insert-confirm 0.25s ease-out; }
        .radio-station.is-inserted { border-color: rgba(34, 197, 94, 0.65); }
        @keyframes insert-confirm { 50% { transform: scale(1.2); } }
        .radio-insert-btn svg { width: 20px; height: 20px; fill: currentColor; vertical-align: middle; margin-right: 7px; }
        .radio-confirm-dialog { width: min(420px, calc(100vw - 40px)); padding: 20px; border: 1px solid var(--border-color); border-radius: 10px; background: var(--card-bg); color: var(--text-color); box-shadow: 0 10px 25px rgba(0,0,0,0.6); box-sizing: border-box; }
        .radio-confirm-dialog::backdrop { background: rgba(0,0,0,0.65); }
        .radio-confirm-dialog p { margin: 0 0 20px; line-height: 1.5; }
        .radio-confirm-actions { display: flex; justify-content: flex-end; gap: 10px; }
        .radio-confirm-actions button { min-width: 76px; padding: 9px 16px; border: 0; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer; }
        .radio-confirm-yes { background: var(--accent-color); }
        .radio-confirm-no { background: #3f3f46; }
        #radioLoadMoreButton { display: block; margin: 10px auto 0; padding: 0 16px; }
        #radioLoadMoreButton[hidden] { display: none; }

        .app-layout { display: flex; flex: 1 1 0; flex-direction: row; gap: 15px; min-height: 0; }
        .navigation-column, .media-column { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
        .navigation-column { flex: 1 1 0; }
        .media-column { flex: 2 1 0; gap: 8px; }

        /* Tabs Navigation Layout */
        .tabs-nav { display: flex; flex: 0 0 auto; gap: 4px; height: 34px; margin-top: 8px; padding: 2px; border: 1px solid var(--border-color); border-radius: 8px; background: #17171a; box-sizing: border-box; position: relative; }
        .tab-btn { flex: 1; min-width: 0; padding: 0 4px; background: transparent; border: none; color: #a1a1aa; font-size: 0.9rem; border-radius: 6px; cursor: pointer; transition: background 0.2s, color 0.2s; font-weight: bold; display: flex; align-items: center; justify-content: center; }
        .tab-label { min-width: 0; }
        .tab-btn.active { background: var(--accent-color); color: #fff; }
        @media (max-width: 480px) {
            .tab-btn { padding: 0 4px; font-size: 0.85rem; }
            .tab-label { white-space: nowrap; }
        }
        .playlist-context-menu { display: none; position: absolute; bottom: calc(100% + 6px); left: 4px; z-index: 110; width: min(280px, calc(100vw - 30px)); padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--menu-bg); box-shadow: 0 10px 15px rgba(0,0,0,0.5); box-sizing: border-box; }
        .playlist-context-menu.show { display: block; }
        .playlist-context-title { margin-bottom: 10px; color: #fff; font-size: 0.9rem; font-weight: bold; overflow-wrap: anywhere; }
        .playlist-save-btn { width: 100%; padding: 9px 12px; border: 0; border-radius: 6px; background: var(--accent-color); color: #fff; font-weight: bold; text-align: left; cursor: pointer; }
        .playlist-save-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .playlist-new-btn { width: 100%; margin-top: 6px; padding: 9px 12px; border: 0; border-radius: 6px; background: transparent; color: #e3e3e6; font-weight: bold; text-align: left; cursor: pointer; }
        .playlist-new-btn:hover:not(:disabled) { background: rgba(255, 255, 255, 0.1); }
        .playlist-new-btn:disabled { opacity: 0.5; cursor: wait; }
        .playlist-save-status { margin: 8px 0 0; color: #a1a1aa; font-size: 0.8rem; overflow-wrap: anywhere; }

        /* Tab Content */
        .tab-panels { display: flex; flex: 1 1 0; flex-direction: column; min-height: 0; }
        .tab-content { display: none; }
        .tab-content.active { display: flex; flex: 1 1 0; flex-direction: column; min-height: 0; }
        #radioSearchForm, #radioLoadMoreButton { flex: 0 0 auto; }
        #radioResultsScroll, #directory-list { flex: 1 1 0; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
        #radioResultsScroll { margin-top: 6px; }

        /* Player Split Layout */
        .player-container { display: flex; flex: 1 1 0; flex-direction: column; min-height: 0; }
        .playlist-wrapper { display: flex; flex: 1 1 0; flex-direction: column; gap: 6px; width: 100%; min-height: 0; }
        #playlistSelect { display: none; }
        .playlist-list-view { display: flex; flex: 1 1 0; flex-direction: column; gap: 5px; width: 100%; min-height: 0; margin: 6px 0 0; padding: 0 4px 0 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; box-sizing: border-box; list-style: none; }
        .playlist-track { display: -webkit-box; width: 100%; flex: 0 0 auto; padding: 5px 12px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--card-bg); color: var(--text-color); font: inherit; text-align: left; overflow-wrap: anywhere; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; cursor: pointer; transition: background 0.2s, border-color 0.2s; }
        .playlist-track:hover { background: #242429; }
        .playlist-track.is-playing { background: var(--accent-color); border-color: var(--accent-color); color: #fff; }
        .playlist-track.is-paused { background: #244b63; border-color: #376985; color: #e0f2fe; }
        .playlist-empty { padding: 20px; border: 1px dashed var(--border-color); border-radius: 8px; color: #71717a; text-align: center; }
        .stream-context-menu { display: none; position: fixed; z-index: 200; width: min(250px, calc(100vw - 24px)); padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--menu-bg); box-shadow: 0 10px 15px rgba(0,0,0,0.5); box-sizing: border-box; }
        .stream-context-menu.show { display: block; }
        .stream-context-title { margin: 0 0 8px; padding: 2px 4px 8px; border-bottom: 1px solid var(--border-color); color: #fff; font-size: 0.9rem; font-weight: bold; overflow-wrap: anywhere; }
        .stream-context-delete { width: 100%; padding: 9px 10px; border: 0; border-radius: 6px; background: transparent; color: #fecaca; text-align: left; cursor: pointer; }
        .stream-context-delete:hover { background: rgba(239, 68, 68, 0.16); }
        .stream-context-info { width: 100%; padding: 9px 10px; border: 0; border-radius: 6px; background: transparent; color: var(--text-color); text-align: left; cursor: pointer; }
        .stream-context-info:hover { background: rgba(255,255,255,0.08); }
        .stream-context-status { margin: 7px 4px 0; color: #a1a1aa; font-size: 0.8rem; }
        .stream-info-dialog { max-height: min(80vh, 700px); overflow-y: auto; }
        .stream-info-details { display: grid; grid-template-columns: minmax(100px, 0.35fr) minmax(0, 1fr); gap: 8px 14px; margin: 0 0 20px; overflow-wrap: anywhere; }
        .stream-info-details dt { color: #a1a1aa; font-weight: bold; }
        .stream-info-details dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
        
        .media-wrapper { display: flex; flex-direction: column; justify-content: center; background: var(--card-bg); border-radius: 8px; padding: 10px; width: 100%; box-sizing: border-box; position: relative; }
        #videoPlayer { width: 100%; height: auto; aspect-ratio: 16/9; background: #000; border-radius: 6px; display: none; }
        #audioPlayer { width: 100%; height: 32px; }
        .playback-status { display: none; margin: 8px 0 0; color: #fca5a5; font-size: 0.9rem; line-height: 1.4; }
        .playback-status.show { display: block; }
        
        .media-wrapper { flex: 1 1 auto; min-height: 0; }
        @media (orientation: portrait) {
            .app-layout { flex-direction: column; }
            .media-column { order: -1; flex: 0 0 auto; }
            .navigation-column { flex: 1 1 0; }
            .media-wrapper { flex: 0 0 auto; }
        }
         
        #videoPlayer, #audioPlayer { transition: opacity 0.5s ease-in-out; opacity: 1; } 
        .fade-out { opacity: 0 !important; }
        
        /* Mobile Navigation Buttons */
        .stream-info-navigation { display: flex; align-items: center; gap: 10px; width: 100%; min-width: 0; }
        .stream-info-navigation .current-stream-info { flex: 1 1 auto; min-width: 0; margin: 0; }
        .mobile-nav-btn { appearance: none; -webkit-appearance: none; display: flex; align-items: center; justify-content: center; flex: 0 0 34px; width: 34px; height: 34px; padding: 0; border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 50%; background: #303039; color: #fff; cursor: pointer; box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3); touch-action: manipulation; -webkit-tap-highlight-color: transparent; transition: background 0.2s, transform 0.1s; }
        .mobile-nav-btn svg { display: block; width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
        .mobile-nav-btn:not(:disabled):hover { background: #464650; }
        .mobile-nav-btn:disabled { opacity: 0.45; cursor: not-allowed; }
        .mobile-nav-btn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
        .mobile-nav-btn:active { transform: scale(0.95); }

        /* Files Directory List */
        .directory-list { list-style: none; padding: 0; margin: 0; }
        .directory-item { background: var(--card-bg); border: 1px solid var(--border-color); padding: 5px 12px; margin-bottom: 5px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; transition: background 0.2s, transform 0.2s; }
        .directory-item:hover { transform: translateX(4px); background: #242429; }
        .file-info { cursor: pointer; flex-grow: 1; display: flex; flex-direction: column; gap: 2px; }
        .file-name { font-weight: bold; color: #fff; font-size: 0.95rem; }
        .file-date { font-size: 0.8rem; color: #71717a; }
        .delete-btn { background: var(--accent-color); color: white; border: none; padding: 6px 12px; font-size: 0.8rem; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        .delete-btn:hover { background: #dc2626; }
        .file-context-menu { display: none; position: fixed; z-index: 210; width: min(220px, calc(100vw - 24px)); padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--menu-bg); box-shadow: 0 10px 15px rgba(0,0,0,0.5); box-sizing: border-box; }
        .file-context-menu.show { display: block; }
        .file-context-title { margin: 0 0 8px; padding: 2px 4px 8px; border-bottom: 1px solid var(--border-color); color: #fff; font-size: 0.9rem; font-weight: bold; overflow-wrap: anywhere; }
        .file-context-delete { width: 100%; padding: 9px 10px; border: 0; border-radius: 6px; background: transparent; color: #fecaca; text-align: left; cursor: pointer; }
        .file-context-delete:hover { background: rgba(239, 68, 68, 0.16); }
        .empty-message { text-align: center; color: #71717a; padding: 30px; font-style: italic; border: 1px dashed var(--border-color); border-radius: 8px; }
    </style>
</head>
<body>

    <!-- Oberer Header mit logischen Layoutanpassungen -->
    <div class="header-container">
        <div class="header-title">AgM3U13</div>
        
        <div class="header-controls">
            <!-- Timer-Anzeigen links vom Kebab-Menü -->
            <div class="status-container">
                <div id="timerStatus"></div>
                <div id="shuffleStatus"></div>
            </div>
            
            <!-- Kebab-Schaltfläche -->
            <button class="kebab-btn" id="kebabBtn" onclick="toggleDropdown(event)">
                <svg viewBox="0 0 24 24">
                    <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
                </svg>
            </button>
            
            <!-- Ausklappbares Dropdown-Menü -->
            <div id="dropdownMenu" class="dropdown-menu">
                <div class="menu-title">Einstellungen</div>
                <label class="menu-label">M3U Playlist(s) laden:</label>
                <input type="file" id="m3uInput" accept=".m3u,.m3u8" multiple>
                <span id="fileNameDisplay">Keine Datei geladen</span>
                
                <label class="menu-label">Wiedergabe stoppen in (Minuten):</label>
                <div class="timer-input-row">
                    <input type="number" id="sleepInput" class="timer-number-input" min="0" max="90" placeholder="0 = Aus" value="0">
                    <button id="setSleepBtn" class="timer-set-btn">Set</button>
                </div>
                
                <label class="menu-label">Stream wechseln in (Minuten):</label>
                <div class="timer-input-row">
                    <input type="number" id="shuffleInput" class="timer-number-input" min="0" max="90" placeholder="0 = Aus" value="0">
                    <button id="setShuffleBtn" class="timer-set-btn">Set</button>
                </div>
                <p id="wakeLockStatus" class="wake-lock-status" role="status" aria-live="polite"></p>
            </div>
        </div>
    </div>
    <main class="app-layout">
        <section class="navigation-column">
            <div class="tab-panels">
                <!-- Tab 1: Player View -->
                <div id="player-tab" class="tab-content active">
                    <div class="player-container">
                        <div class="playlist-wrapper">
                            <div class="search-container">
                                <input type="text" id="searchBar" placeholder="Stream suchen...">
                            </div>
                            <select id="playlistSelect">
                                <option value="">-- Bitte M3U laden --</option>
                            </select>
                            <div id="playlistListView" class="playlist-list-view" role="group" aria-label="Player-Playlist"></div>
                            <div id="streamContextMenu" class="stream-context-menu" role="menu" aria-label="Stream-Menü">
                                <p id="streamContextTitle" class="stream-context-title"></p>
                                <button id="streamInfoMenuItem" class="stream-context-info" type="button" role="menuitem">Info</button>
                                <button id="streamHomepageMenuItem" class="stream-context-info" type="button" role="menuitem" hidden>Homepage</button>
                                <button id="deleteStreamMenuItem" class="stream-context-delete" type="button" role="menuitem">löschen</button>
                                <p id="streamContextStatus" class="stream-context-status" role="status" aria-live="polite"></p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Tab 2: Files View (Dateiverzeichnis) -->
                <div id="files-tab" class="tab-content">
                    <ul id="directory-list" class="directory-list">
                        <!-- Gespeicherte Listen landen hier dynamisch -->
                    </ul>
                    <div id="fileContextMenu" class="file-context-menu" role="menu" aria-label="Datei-Menü">

        async function createNewPlaylist() {
            const content = '#EXTM3U\n';

            try {

                        suggestedName: name,
                        types: [{
                            description: 'M3U-Playlist',
                            accept: { 'audio/x-mpegurl': ['.m3u'] }
                        }]
                    });
                    name = fileHandle.name;
                    const writable = await fileHandle.createWritable();
                    await writable.write(new Blob([content], { type: 'audio/x-mpegurl;charset=utf-8' }));
                    await writable.close();
                } else {
                    const objectUrl = URL.createObjectURL(new Blob([content], { type: 'audio/x-mpegurl;charset=utf-8' }));
                    const link = document.createElement('a');
                    link.href = objectUrl;
                    link.download = name;
                    link.click();
                    setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
                }

                closeLoadedPlaylist();
                fileNameDisplay.textContent = `Geladene Datei: ${name}`;
                searchBar.value = '';
                setSearchPlaceholder(name);
                localStorage.setItem('lastM3UData', content);

        function sortLoadedPlaylistAlphabetically() {
            const playlistData = localStorage.getItem('lastM3UData');
            if (!playlistData) {
                playlistSaveStatus.textContent = 'Keine Playlist zum Sortieren vorhanden.';
                return;
            }

            const lines = playlistData.replace(/^\uFEFF/, '').split(/\r?\n/);
            while (lines.length && lines[lines.length - 1] === '') lines.pop();

            const header = [];
            const entries = [];
            let pending = [];

            lines.forEach(line => {
                if (!line.trim() || line.trim().startsWith('#')) {
                    pending.push(line);
                    return;
                }

                let entryLines = pending;
                if (!entries.length) {
                    const extinfIndex = pending.findIndex(pendingLine => pendingLine.trim().startsWith('#EXTINF:'));
                    if (extinfIndex >= 0) {
                        header.push(...pending.slice(0, extinfIndex));
                        entryLines = pending.slice(extinfIndex);
                    } else {
                        while (entryLines.length && /^#(?:EXTM3U|AGSLEP_APP:)/i.test(entryLines[0].trim())) {
                            header.push(entryLines.shift());
                        }
                    }
                }
                entryLines.push(line);
                const extinfLine = entryLines.find(entryLine => entryLine.trim().startsWith('#EXTINF:'));
                const commaIndex = extinfLine ? extinfLine.indexOf(',') : -1;
                const title = commaIndex >= 0 ? extinfLine.slice(commaIndex + 1).trim() : line.trim();
                entries.push({ lines: entryLines, title });
                pending = [];
            });

            if (!entries.length) {
                playlistSaveStatus.textContent = 'Die Playlist enthält keine Streams zum Sortieren.';
                return;
            }

            const sortedEntries = entries.sort((a, b) => a.title.localeCompare(b.title, 'de', { sensitivity: 'base', numeric: true }));
            const updatedPlaylist = [...header, ...sortedEntries.flatMap(entry => entry.lines), ...pending].join('\n') + '\n';
            persistUpdatedPlaylist(updatedPlaylist);
            updateM3ULastStreamMarker(currentPlayingUrl);
            playlistSaveStatus.textContent = 'Playlist wurde alphabetisch sortiert.';
        }

        async function fetchRadioStations(query, offset, append) {
            if (radioSearchController) radioSearchController.abort();
            radioSearchController = new AbortController();
            const controller = radioSearchController;
            radioSearchButton.disabled = true;
            radioLoadMoreButton.disabled = true;
            radioSearchStatus.textContent = append ? 'Weitere Sender werden geladen...' : 'Suche läuft...';
            if (!append) {
                radioResults.replaceChildren();
                radioLoadMoreButton.hidden = true;
            }

            try {
                const params = new URLSearchParams({
                    name: query,
                    limit: String(radioPageSize + 1),
                    offset: String(offset),
                    order: 'clickcount',
                    reverse: 'true'
                });
                const response = await fetch(`https://all.api.radio-browser.info/json/stations/search?${params}`, {
                    signal: controller.signal
                });
                if (!response.ok) throw new Error(`Radio-Browser antwortet mit HTTP ${response.status}.`);

                const stations = await response.json();
                if (!Array.isArray(stations)) throw new Error('Die Radio-Browser-Antwort hat ein unerwartetes Format.');
                if (controller !== radioSearchController) return;

                const hasMore = stations.length > radioPageSize;
                const pageStations = stations.slice(0, radioPageSize);
                const addedCount = renderRadioStations(pageStations, append);
                radioSearchOffset = offset + pageStations.length;
                radioLoadMoreButton.hidden = !hasMore;
                radioSearchStatus.textContent = append
                    ? `${addedCount} weitere Sender geladen.`
                    : stations.length ? `${addedCount} Sender gefunden.` : 'Keine Sender gefunden.';
            } catch (error) {
                if (error.name === 'AbortError' || controller !== radioSearchController) return;
                radioSearchStatus.textContent = `Suche fehlgeschlagen: ${error.message}`;
            } finally {
                if (controller === radioSearchController) {
                    radioSearchButton.disabled = false;
                    radioLoadMoreButton.disabled = false;
                }
            }
        }

        function renderRadioStations(stations, append = false) {
            const fragment = document.createDocumentFragment();
            const knownStationIds = new Set(
                Array.from(radioResults.querySelectorAll('.radio-station'), item => item.dataset.stationuuid)
            );
            let addedCount = 0;
            stations.forEach(function(station) {
                if (!station || !station.stationuuid || knownStationIds.has(station.stationuuid) ||
                    !station.name || !(station.url_resolved || station.url)) return;

                const item = document.createElement('li');
                item.className = 'radio-station';
                item.dataset.stationuuid = station.stationuuid;
                item.dataset.streamUrl = station.url_resolved || station.url;
                item.radioStation = station;
                const info = document.createElement('div');
                info.className = 'radio-station-info';
                info.setAttribute('role', 'button');
                info.setAttribute('tabindex', '0');
                info.setAttribute('aria-expanded', 'false');
                info.setAttribute('aria-label', `Sender abspielen: ${station.name}`);

                const name = document.createElement('span');
                name.className = 'radio-station-name';
                name.textContent = station.name;
                info.appendChild(name);

                const details = [station.country, station.language, station.codec, station.bitrate ? `${station.bitrate} kbit/s` : '']
                    .filter(Boolean)
                    .join(' · ');
                if (details) {
                    const detailLine = document.createElement('span');
                    detailLine.className = 'radio-station-details';
                    detailLine.textContent = details;
                    info.appendChild(detailLine);
                }

                const insertButton = document.createElement('button');
                insertButton.type = 'button';
                insertButton.className = 'radio-insert-btn';
                insertButton.setAttribute('role', 'menuitem');
                insertButton.setAttribute('aria-label', `Sender ${station.name} in die Playlist einfügen`);
                insertButton.title = 'In die Playlist';
                insertButton.textContent = 'In die Playlist';
                insertButton.disabled = !localStorage.getItem('lastM3UData');
                insertButton.addEventListener('click', function() {
                    insertRadioStation(station, insertButton);
                });

                const insertAllButton = document.createElement('button');
                insertAllButton.type = 'button';
                insertAllButton.className = 'radio-insert-all-btn';
                insertAllButton.setAttribute('role', 'menuitem');
                insertAllButton.textContent = 'Alle in Playlist';
                insertAllButton.disabled = !localStorage.getItem('lastM3UData');
                insertAllButton.addEventListener('click', function() {
                    if (!localStorage.getItem('lastM3UData')) {
                        radioSearchStatus.textContent = 'Lade zuerst eine Playlist im Player, bevor du Sender einfügst.';
                        return;
                    }
                    closeRadioStationMenus();
                    radioAddAllConfirmDialog.showModal();
                });

                const infoButton = document.createElement('button');
                infoButton.type = 'button';
                infoButton.className = 'radio-info-btn';
                infoButton.setAttribute('role', 'menuitem');
                infoButton.textContent = 'Info';
                infoButton.addEventListener('click', function() {
                    closeRadioStationMenus();
                    showStreamInfo(station.url_resolved || station.url, station);
                });

                const stationMenu = document.createElement('div');
                stationMenu.className = 'radio-station-menu';
                stationMenu.setAttribute('role', 'menu');
                const menuTitle = document.createElement('p');
                menuTitle.className = 'radio-station-menu-title';
                menuTitle.textContent = station.name;
                stationMenu.append(menuTitle, infoButton);
                const homepageUrl = getValidHomepageUrl(station.homepage);
                if (homepageUrl) {
                    const homepageButton = document.createElement('button');
                    homepageButton.type = 'button';
                    homepageButton.className = 'radio-homepage-btn';
                    homepageButton.setAttribute('role', 'menuitem');
                    homepageButton.textContent = 'Homepage';
                    homepageButton.addEventListener('click', function() {
                        closeRadioStationMenus();
                        openHomepage(homepageUrl);
                    });
                    stationMenu.appendChild(homepageButton);
                }
                stationMenu.append(insertButton, insertAllButton);

                item.append(info, stationMenu);
                fragment.appendChild(item);
                knownStationIds.add(station.stationuuid);
                addedCount++;
            });
            if (append) radioResults.appendChild(fragment);
            else radioResults.replaceChildren(fragment);
            updateRadioStationButtons();
            updateRadioInsertButtons();
            return addedCount;
        }

        function updateRadioStationButtons() {
            const isLastRadioStation = station => Boolean(
                lastRadioStation &&
                (lastRadioStation.stationuuid === station.stationuuid ||
                    (lastRadioStation.url_resolved || lastRadioStation.url) === (station.url_resolved || station.url))
            );
            radioResults.querySelectorAll('.radio-station').forEach(item => {
                const isLastStation = isLastRadioStation(item.radioStation);
                const isCurrentStationPlaying = isLastStation && currentRadioStation &&
                    isLastRadioStation(currentRadioStation) && currentPlayingUrl === (item.radioStation.url_resolved || item.radioStation.url) &&
                    activePlayer && !activePlayer.paused && !activePlayer.ended;
                item.classList.toggle('is-playing', isCurrentStationPlaying);
                item.classList.toggle('is-paused', isLastStation && !isCurrentStationPlaying);
                const info = item.querySelector('.radio-station-info');
                const playbackLabel = isCurrentStationPlaying ? 'Sender stoppen' : isLastStation ? 'Sender fortsetzen' : 'Sender abspielen';
                info.setAttribute('aria-label', `${playbackLabel}: ${item.radioStation.name}`);
            });
        }

        function toggleRadioStation(station) {
            if (currentRadioStation && currentRadioStation.stationuuid === station.stationuuid &&
                activePlayer && !activePlayer.paused && !activePlayer.ended) {
                activePlayer.pause();
                try { activePlayer.currentTime = 0; } catch (error) {}
                updatePlaybackButton();
                radioSearchStatus.textContent = `Gestoppt: ${station.name}`;
                return;
            }

            playRadioStation(station);
        }

        function playRadioStation(station, immediate = false) {
            if (radioPlaybackInProgress) return;
            radioPlaybackInProgress = true;

            try {
                const streamUrl = station.url_resolved || station.url;
                const parsedUrl = new URL(streamUrl);
                if (!['http:', 'https:'].includes(parsedUrl.protocol)) throw new Error('Ungültiges Stream-Protokoll.');
                const sameStream = currentPlayingUrl === streamUrl;
                if (!currentRadioStation && playlistTracks.some(track => track.url === currentPlayingUrl)) {
                    lastPlayerTrackUrl = currentPlayingUrl;
                }
                currentRadioStation = station;
                lastRadioStation = station;
                currentPlayingUrl = streamUrl;
                playlistSelect.value = '';

                if (sameStream && activePlayer && activePlayer.paused) {
                    const playRequest = activePlayer.play();
                    if (playRequest) {
                        playRequest.catch(error => {
                            radioSearchStatus.textContent = `Stream konnte nicht gestartet werden: ${error.message}`;
                        });
                    }
                } else if (!sameStream || !activePlayer) {
                    if (activePlayer) {
                        activePlayer.pause();
                        activePlayer.classList.remove('fade-out');
                        activePlayer.volume = 1;
                    }
                    playMedia(streamUrl, 0, true, immediate);
                }
                updateMediaSessionMetadata();
                updatePlaybackButton();
                radioSearchStatus.textContent = `Lade Stream: ${station.name}`;
            } catch (error) {
                radioSearchStatus.textContent = `Sender konnte nicht gestartet werden: ${error.message}`;
                radioPlaybackInProgress = false;
                return;
            }

            radioPlaybackInProgress = false;
            fetch(`https://all.api.radio-browser.info/json/url/${encodeURIComponent(station.stationuuid)}`)
                .then(response => {
                    if (!response.ok) throw new Error(`Radio-Browser antwortet mit HTTP ${response.status}.`);
                    return response.json();
                })
                .then(result => {
                    if (!result.ok) throw new Error(result.message || 'Klick konnte nicht registriert werden.');
                })
                .catch(error => {
                    if (currentPlayingUrl === (station.url_resolved || station.url)) {
                        radioSearchStatus.textContent = `Stream wird geladen, aber der Klick konnte nicht registriert werden: ${error.message}`;
                    }
                });
        }

            const streamUrl = station.url_resolved || station.url;
            let parsedUrl;
            try {
                parsedUrl = new URL(streamUrl);
            } catch (error) {
                radioSearchStatus.textContent = 'Dieser Sender hat eine ungültige Stream-Adresse.';
                setRadioInsertFeedback(button, 'error');
                return;
            }
            if (!['http:', 'https:'].includes(parsedUrl.protocol)) {
                radioSearchStatus.textContent = 'Dieser Sender hat eine ungültige Stream-Adresse.';
                setRadioInsertFeedback(button, 'error');
                return;

            if (playlistData.split(/\r?\n/).some(line => line.trim() === streamUrl)) {
                radioSearchStatus.textContent = `„${station.name}“ ist bereits in der Playlist.`;
                setRadioInsertFeedback(button, 'duplicate');

            const safeTitle = station.name.replace(/[\r\n]/g, ' ').trim() || 'Unbekannter Sender';
            const separator = playlistData && !playlistData.endsWith('\n') ? '\n' : '';
            const updatedPlaylist = `${playlistData}${separator}#EXTINF:-1,${safeTitle}\n${streamUrl}\n`;
            persistUpdatedPlaylist(updatedPlaylist);

        function insertAllRadioStations() {
            const playlistData = localStorage.getItem('lastM3UData');
            if (!playlistData) {
                radioSearchStatus.textContent = 'Lade zuerst eine Playlist im Player, bevor du Sender einfügst.';
                return;
            }

            const stations = Array.from(radioResults.querySelectorAll('.radio-station'), item => item.radioStation);
            if (!stations.length) {
                radioSearchStatus.textContent = 'Es wurden keine Streams gefunden.';
                return;
            }

            const existingUrls = new Set(playlistData.split(/\r?\n/).map(line => line.trim()).filter(Boolean));
            const newEntries = [];
            let duplicateCount = 0;
            let invalidCount = 0;
            stations.forEach(station => {
                const streamUrl = station.url_resolved || station.url;
                let parsedUrl;
                try {
                    parsedUrl = new URL(streamUrl);
                } catch (error) {
                    invalidCount++;
                    return;
                }
                if (!['http:', 'https:'].includes(parsedUrl.protocol)) {
                    invalidCount++;
                    return;
                }
                if (existingUrls.has(streamUrl)) {
                    duplicateCount++;
                    return;
                }

                existingUrls.add(streamUrl);
                const safeTitle = station.name.replace(/[\r\n]/g, ' ').trim() || 'Unbekannter Sender';
                newEntries.push(`#EXTINF:-1,${safeTitle}\n${streamUrl}`);
            });

            if (!newEntries.length) {
                radioSearchStatus.textContent = `Keine neuen Streams hinzugefügt. Bereits vorhanden: ${duplicateCount}${invalidCount ? `; ungültig: ${invalidCount}` : ''}.`;
                return;
            }

            const separator = playlistData && !playlistData.endsWith('\n') ? '\n' : '';
            persistUpdatedPlaylist(`${playlistData}${separator}${newEntries.join('\n')}\n`);
            radioSearchStatus.textContent = `${newEntries.length} Streams am Ende der Playlist hinzugefügt.${duplicateCount ? ` ${duplicateCount} bereits vorhandene übersprungen.` : ''}${invalidCount ? ` ${invalidCount} ungültige übersprungen.` : ''}`;
        }

        function initCombinedTimer() {
            clearInterval(timerInterval);
            if (activePlayer && !activePlayer.paused && shuffleTimerMinutes > 0 && !isShufflePausedManually && !shuffleLastTickAt) {
                shuffleLastTickAt = Date.now();
            }
            syncScreenWakeLock();
            updateTimerDisplays();
            if (sleepTimerMinutes === 0 && shuffleTimerMinutes === 0) return;

            timerInterval = setInterval(tickCombinedTimer, 1000);
        }

        function tickCombinedTimer() {
            if (!activePlayer || activePlayer.paused) {
                shuffleLastTickAt = 0;
                return;
            }

            if (sleepTimerMinutes > 0 && !isSleepPausedManually) {
                sleepTimeLeft--;
                if (sleepTimeLeft <= 0) {
                    activePlayer.pause();
                    sleepTimeLeft = sleepTimerMinutes * 60;
                    timerStatus.innerHTML = "⏱️ Abgelaufen";
                    timerStatus.classList.remove('timer-paused');
                    return;
                }
            }
            if (shuffleTimerMinutes > 0 && !isShufflePausedManually) {
                const now = Date.now();
                if (!shuffleLastTickAt) shuffleLastTickAt = now;
                shuffleTimeLeft -= (now - shuffleLastTickAt) / 1000;
                shuffleLastTickAt = now;
                if (shuffleTimeLeft <= 0) {
                    shuffleTimeLeft = 0;
                    shuffleLastTickAt = 0;
                    skipAttempts = 0;
                    switchToNextStreamFromActiveTab(true);
                    return;
                }
            }
            updateTimerDisplays();
        }

        async function syncScreenWakeLock() {
            const requestId = ++wakeLockRequestId;
            const shouldHoldScreen = shuffleTimerMinutes > 0 && !isShufflePausedManually && !document.hidden;
            if (!shouldHoldScreen) {
                if (screenWakeLock) {
                    const lock = screenWakeLock;
                    screenWakeLock = null;
                    await lock.release();
                }
                wakeLockStatus.textContent = '';
                return;
            }

            if (!('wakeLock' in navigator)) {
                wakeLockStatus.textContent = 'Dieser Browser kann den Bildschirm nicht wach halten. Android kann den Shuffle-Timer bei ausgeschaltetem Display anhalten.';
                return;
            }
            if (screenWakeLock && !screenWakeLock.released) return;

            try {
                const lock = await navigator.wakeLock.request('screen');
                if (requestId !== wakeLockRequestId ||
                    shuffleTimerMinutes === 0 ||
                    isShufflePausedManually ||
                    document.hidden) {
                    await lock.release();
                    return;
                }

                screenWakeLock = lock;
                wakeLockStatus.textContent = 'Bildschirm bleibt während des aktiven Shuffle-Timers eingeschaltet.';
                lock.addEventListener('release', function() {
                    if (screenWakeLock !== lock) return;
                    screenWakeLock = null;
                    if (shuffleTimerMinutes > 0 && !isShufflePausedManually && !document.hidden) {
                        wakeLockStatus.textContent = 'Die Bildschirm-Wachhaltefunktion wurde vom Gerät beendet.';
                    }
                }, { once: true });
            } catch (error) {
                if (requestId !== wakeLockRequestId) return;
                wakeLockStatus.textContent = `Bildschirm konnte nicht wach gehalten werden: ${error.message}`;
            }
        }

        document.addEventListener('visibilitychange', function() {
            syncScreenWakeLock();
            if (!document.hidden) tickCombinedTimer();
        });

        function updateTimerDisplays() {
            const currentSleepSetting = sleepTimerMinutes;
            if (currentSleepSetting > 0 && sleepTimeLeft > 0) {
                const m = Math.floor(sleepTimeLeft / 60), s = sleepTimeLeft % 60;
                const iconClass = isSleepPausedManually ? '' : 'class="icon-flip"';
                timerStatus.innerHTML = `<span ${iconClass}>⏳</span> ${m}:${s < 10 ? '0' : ''}${s}`;
                if (isSleepPausedManually) timerStatus.classList.add('timer-paused');
                else timerStatus.classList.remove('timer-paused');
            } else {
                timerStatus.innerHTML = ''; timerStatus.classList.remove('timer-paused');
            }

            const currentShuffleSetting = shuffleTimerMinutes;
            if (currentShuffleSetting > 0 && shuffleTimeLeft > 0) {
                const wholeSeconds = Math.ceil(shuffleTimeLeft);
                const m = Math.floor(wholeSeconds / 60), s = wholeSeconds % 60;
                const iconClass = isShufflePausedManually ? '' : 'class="icon-spin"';
                shuffleStatus.innerHTML = `<span ${iconClass}>🔄</span> ${m}:${s < 10 ? '0' : ''}${s}`;
                if (isShufflePausedManually) shuffleStatus.classList.add('timer-paused');
                else shuffleStatus.classList.remove('timer-paused');
            } else {
                shuffleStatus.innerHTML = ''; shuffleStatus.classList.remove('timer-paused');
            }
        }

        function removeStreamFromPlaylist(streamUrl) {
            const playlistData = localStorage.getItem('lastM3UData');
            if (!playlistData) {
                streamContextStatus.textContent = 'Keine geladene Playlist zum Bearbeiten vorhanden.';
                return;
            }

            const lines = playlistData.split(/\r?\n/);
            const removeLines = new Set();
            lines.forEach((line, index) => {
                if (line.trim() !== streamUrl) return;

                let entryStart = index;
                for (let cursor = index - 1; cursor >= 0; cursor--) {
                    const previousLine = lines[cursor].trim();
                    if (previousLine.startsWith('#EXTINF:')) {
                        entryStart = cursor;
                        break;
                    }
                    if (previousLine && !previousLine.startsWith('#')) break;
                }
                for (let cursor = entryStart; cursor <= index; cursor++) removeLines.add(cursor);
            });

            const updatedPlaylist = lines.filter((_, index) => !removeLines.has(index)).join('\n');
            if (removeLines.size === 0) {
                streamContextStatus.textContent = 'Der Stream wurde in der gespeicherten Playlist nicht gefunden.';
                return;
            }

            const removingActiveStream = currentPlayingUrl === streamUrl;
            if (removingActiveStream) {
                if (activePlayer) {
                    activePlayer.pause();
                    activePlayer.removeAttribute('src');
                    activePlayer.load();
                    activePlayer.classList.remove('fade-out');
                    activePlayer.volume = 1;
                }
                if (hls) {
                    hls.destroy();
                    hls = null;
                }
                clearTimeout(errorTimeout);
                currentRadioStation = null;
                currentPlayingUrl = '';
                lastPlayerTrackUrl = '';
                activePlayer = null;
                localStorage.removeItem('lastM3UTrack');
                localStorage.removeItem('lastM3UTime');
            }
            localStorage.setItem('lastM3UData', updatedPlaylist);
            const loadedName = (localStorage.getItem('lastM3UFileName') || '').replace(/^Geladene Datei:\s*/, '').trim();
            if (loadedName === '_CHRISTIAN.m3u') {
                document.getElementById('bundled-christian-m3u').textContent = updatedPlaylist;
            }
            parseM3U(updatedPlaylist);
            updatePlaybackButton();

            const savedPlaylists = JSON.parse(localStorage.getItem('agm3u_playlists') || '[]');
            const savedPlaylist = savedPlaylists.find(playlist => playlist.name === loadedName);
            if (savedPlaylist) {
                savedPlaylist.content = updatedPlaylist;
                localStorage.setItem('agm3u_playlists', JSON.stringify(savedPlaylists));
                renderDirectory();
            }

            streamContextStatus.textContent = `„${streamContextTitle.textContent}“ wurde aus der Playlist gelöscht.`;
            deleteStreamMenuItem.disabled = true;
        }

        function getStreamHomepage(streamUrl) {
            const track = playlistTracks.find(item => item.url === streamUrl);
            const extinfLine = track && track.infoLines && track.infoLines.find(line => line.trim().startsWith('#EXTINF:'));
            const metadataMatch = extinfLine && extinfLine.match(/(?:^|\s)homepage=(["'])(.*?)\1/i);
            const playlistHomepage = getValidHomepageUrl(metadataMatch && metadataMatch[2]);
            if (playlistHomepage) return playlistHomepage;

            const matchesStream = station => station && (station.url === streamUrl || station.url_resolved === streamUrl);
            const station = (currentRadioStation && matchesStream(currentRadioStation) ? currentRadioStation : null) ||
                Array.from(radioResults.querySelectorAll('.radio-station'), item => item.radioStation).find(matchesStream);
            return getValidHomepageUrl(station && station.homepage);

        async function fetchRadioBrowserStationInfo(streamUrl, streamTitle, statusElement) {
            if (streamInfoRequestController) streamInfoRequestController.abort();
            const controller = new AbortController();
            streamInfoRequestController = controller;
            try {
                const searchName = streamTitle.replace(/\s*[-–|]\s*\d+\s*kbit\/s(?:\s*[-–|]\s*\d+\s*kbit\/s)*\s*$/i, '').trim();
                const params = new URLSearchParams({ name: searchName, limit: '100' });
                const response = await fetch(`https://all.api.radio-browser.info/json/stations/search?${params}`, {
                    signal: controller.signal
                });
                if (!response.ok) throw new Error(`Radio-Browser antwortet mit HTTP ${response.status}.`);
                const stations = await response.json();
                if (!Array.isArray(stations)) throw new Error('Die Radio-Browser-Antwort hat ein unerwartetes Format.');
                if (controller !== streamInfoRequestController || !streamInfoDialog.open) return;

                statusElement.previousElementSibling.remove();
                statusElement.remove();
                const matchesStream = item => item && (item.url === streamUrl || item.url_resolved === streamUrl);
                const station = stations.find(matchesStream) ||
                    (currentRadioStation && matchesStream(currentRadioStation) ? currentRadioStation : null) ||
                    Array.from(radioResults.querySelectorAll('.radio-station'), item => item.radioStation).find(matchesStream);
                if (!station) {
                    appendStreamInfoRow('Radio-Browser', 'Für diese Stream-URL wurde kein Senderdatensatz gefunden.');
                    return;
                }

                appendRadioBrowserStationInfo(station);
            } catch (error) {
                if (error.name === 'AbortError' || controller !== streamInfoRequestController) return;
                statusElement.textContent = `Senderdaten konnten nicht geladen werden: ${error.message}`;
            }
        }

            const currentOptions = Array.from(playlistSelect.querySelectorAll('option')).filter(o => o.value !== "");

        function parseM3U(data) {
            playlistTracks = []; 
            let title = ''; 
            let infoLines = [];
            const seenUrls = new Set();
            
            if (data.charCodeAt(0) === 0xFEFF) {
                data = data.substr(1);
            }

            data.split('\n').forEach(function(l) {
                l = l.trim(); if (!l) return;
                if (l.indexOf('#EXTINF:') === 0) {
                    const c = l.indexOf(','); title = c !== -1 ? l.substring(c + 1).trim() : 'Unbekannter Titel';
                    infoLines = [l];
                } else if (l.indexOf('#') !== 0) {
                    if (!seenUrls.has(l)) { seenUrls.add(l); playlistTracks.push({title: title || l, url: l, infoLines: [...infoLines]}); }
                    title = '';
                    infoLines = [];
                } else if (infoLines.length) {
                    infoLines.push(l);
                }
            });
            filterAndRender();
            updateRadioInsertButtons();
        }

        function getM3ULastStreamMarker(data) {
            const indexMatch = data.match(/#AGSLEP_LAST_INDEX\s*:\s*(\d+)/i);
            const streamMatch = data.match(/#AGSLEP_LAST_STREAM\s*:\s*([^#\r\n]*?)(?=\s+#|[\r\n]|$)/i);
            return {
                index: indexMatch ? Number(indexMatch[1]) : null,
                title: streamMatch ? streamMatch[1].trim() : ''
            };
        }

        function restoreM3ULastStreamSelection(data) {
            const marker = getM3ULastStreamMarker(data);
            const markedTrack = Number.isInteger(marker.index) && marker.index >= 0
                ? playlistTracks[marker.index]
                : null;
            const track = markedTrack || (marker.title
                ? playlistTracks.find(item => item.title.toLocaleLowerCase() === marker.title.toLocaleLowerCase())
                : null);
            if (!track) return false;

            currentPlayingUrl = track.url;
            lastPlayerTrackUrl = track.url;
            playlistSelect.value = track.url;
            localStorage.setItem('lastM3UTrack', track.url);
            localStorage.removeItem('lastM3UTime');
            updateMediaSessionMetadata();
            updatePlaybackButton();
            return true;
        }

        function updateM3ULastStreamMarker(streamUrl) {
            const playlistData = localStorage.getItem('lastM3UData');
            const trackIndex = playlistTracks.findIndex(track => track.url === streamUrl);
            if (!playlistData || trackIndex < 0) return;

            const track = playlistTracks[trackIndex];
            const safeTitle = track.title.replace(/[\r\n]/g, ' ').trim();
            const lines = playlistData.replace(/^\uFEFF/, '').split(/\r?\n/).filter(line => !/#AGSLEP_LAST_(?:INDEX|STREAM)\s*:/i.test(line));
            const headerIndex = lines.findIndex(line => line.trim().toUpperCase() === '#EXTM3U');
            const markerLines = [`#AGSLEP_LAST_INDEX:${trackIndex}`, `#AGSLEP_LAST_STREAM:${safeTitle}`];
            lines.splice(headerIndex >= 0 ? headerIndex + 1 : 0, 0, ...markerLines);
            const updatedPlaylist = `${lines.join('\n').replace(/\n+$/, '')}\n`;
            localStorage.setItem('lastM3UData', updatedPlaylist);

            const loadedName = (localStorage.getItem('lastM3UFileName') || '').replace(/^Geladene Datei:\s*/, '').trim();
            const savedPlaylists = JSON.parse(localStorage.getItem('agm3u_playlists') || '[]');
            const savedPlaylist = savedPlaylists.find(playlist => playlist.name === loadedName);
            if (savedPlaylist) {
                savedPlaylist.content = updatedPlaylist;
                localStorage.setItem('agm3u_playlists', JSON.stringify(savedPlaylists));
                renderDirectory();
            }
            updatePlaylistContextMenu();
        }

        function fadeVolumeOut(player, callback) {
            if (!player || player.paused) {
                if (callback) callback();
                return;
            }
            let volume = player.volume;
            const interval = 50; 
            const step = volume / (500 / interval); 

            const fadeInterval = setInterval(() => {
                if (volume > step) {
                    volume -= step;
                    player.volume = volume;
                } else {
                    clearInterval(fadeInterval);
                    player.volume = 0;
                    if (callback) callback();
                }
            }, interval);
        }

        function fadeVolumeIn(player) {
            if (!player) return;
            player.volume = 0;
            let volume = 0;
            const targetVolume = 1.0; 
            const interval = 50;
            const step = targetVolume / (500 / interval); 

            const fadeInterval = setInterval(() => {
                if (volume < targetVolume - step) {
                    volume += step;
                    player.volume = volume;
                } else {
                    clearInterval(fadeInterval);
                    player.volume = targetVolume;
                }
            }, interval);
        }

        function playMedia(url, time = 0, triggerPlay = true, immediate = false) {
            clearTimeout(errorTimeout);
            if (hls) { hls.destroy(); hls = null; }

            if (!url) {
                if (activePlayer) {
                    activePlayer.pause();
                    activePlayer.src = "";
                    try { activePlayer.load(); } catch(e) {}
                }
                return;
            }

            if (activePlayer && triggerPlay && !immediate) {
                activePlayer.classList.add('fade-out');
                fadeVolumeOut(activePlayer, () => {
                    activePlayer.pause();
                    setupNewMedia(url, time, triggerPlay);
                });
                return;
            }

            if (activePlayer) activePlayer.pause();
            setupNewMedia(url, time, triggerPlay);
        }

        function setupNewMedia(url, time, triggerPlay) {
            const isVid = /\.(mp4|m3u8|webm|ts)/i.test(url) || url.includes('type=video') || url.includes('m3u8') || url.includes('.ts');
            audioPlayer.style.display = isVid ? 'none' : 'block';
            videoPlayer.style.display = isVid ? 'block' : 'none';

            activePlayer = isVid ? videoPlayer : audioPlayer;
            updateMediaSessionMetadata();
            updatePlaybackButton();

            if (isVid && (url.includes('m3u8') || url.endsWith('.m3u8'))) {
                if (Hls.isSupported()) {
                    hls = new Hls();
                    hls.loadSource(url);
                    hls.attachMedia(activePlayer);
                } else if (activePlayer.canPlayType('application/vnd.apple.mpegurl')) {
                    activePlayer.src = url;
                }
            } else {
                activePlayer.src = url;
            }

            if (triggerPlay) {
                activePlayer.classList.add('fade-out');
                activePlayer.volume = 0;
            } else {
                activePlayer.volume = 1.0;
            }

            activePlayer.onerror = function() {
                if (!triggerPlay || !currentPlayingUrl) return;
                clearTimeout(errorTimeout);
                errorTimeout = setTimeout(function() {
                    if (!activePlayer.src && !hls || !currentPlayingUrl) return;
                    if (activePlayer.error || activePlayer.paused) {
                        console.log("Stream dauerhaft defekt. Schalte weiter...");
                        activePlayer.classList.remove('fade-out'); activePlayer.volume = 1.0;
                        skipAttempts++; switchToNextStreamFromActiveTab(true);
                    }
                }, 5000);
            };

            activePlayer.onwaiting = function() {
                if (!triggerPlay || !currentPlayingUrl) return;
                clearTimeout(errorTimeout);
                errorTimeout = setTimeout(function() {
                    if (!activePlayer.src && !hls || !currentPlayingUrl) return;
                    console.log("Stream puffert zu lange. Schalte weiter...");
                    activePlayer.classList.remove('fade-out'); activePlayer.volume = 1.0;
                    skipAttempts++; switchToNextStreamFromActiveTab(true);
                }, 5000);
            };

            activePlayer.addEventListener('timeupdate', function() {
                if (!currentPlayingUrl) return;
                if (activePlayer.currentTime > 0) {
                    clearTimeout(errorTimeout); skipAttempts = 0;
                    if (!currentRadioStation) localStorage.setItem('lastM3UTime', activePlayer.currentTime);
                }
            });

            activePlayer.addEventListener('play', function() {
                if (shuffleTimerMinutes > 0 && !isShufflePausedManually && !shuffleLastTickAt) {
                    shuffleLastTickAt = Date.now();
                }
                initCombinedTimer();
            });
            activePlayer.addEventListener('play', function() {
                playbackStatus.textContent = '';
                playbackStatus.classList.remove('show');
                updateM3ULastStreamMarker(currentPlayingUrl);
                updatePlaybackButton();
            });
            activePlayer.addEventListener('pause', function() {
                shuffleLastTickAt = 0;
                updatePlaybackButton();
            });
            activePlayer.addEventListener('ended', updatePlaybackButton);
            activePlayer.load();

            activePlayer.addEventListener('loadedmetadata', function() {
                if (!url || !currentPlayingUrl) return;
                activePlayer.currentTime = time;
                if (!triggerPlay) {
                    activePlayer.classList.remove('fade-out'); activePlayer.volume = 1.0;
                }
            }, { once: true });

            if (triggerPlay) {
                const player = activePlayer;
                const playRequest = player.play();
                if (playRequest) {
                    playRequest.then(() => {
                        if (activePlayer !== player || currentPlayingUrl !== url) return;
                        updatePlaybackButton();
                        setTimeout(() => {
                            if (activePlayer !== player || currentPlayingUrl !== url) return;
                            player.classList.remove('fade-out');
                            fadeVolumeIn(player);
                        }, 50);
                    }).catch(error => {
                        if (activePlayer !== player || currentPlayingUrl !== url) return;
                        player.classList.remove('fade-out');
                        player.volume = 1.0;
                        playbackStatus.textContent = error.name === 'NotAllowedError'
                            ? 'Das Gerät hat den automatischen Wiedergabestart blockiert. Tippe auf Wiedergabe, um fortzufahren.'
                            : `Stream konnte nicht gestartet werden: ${error.message}`;
                        playbackStatus.classList.add('show');
                        updatePlaybackButton();
                    });
                }
            }
        }

        function switchToPrevStream() {
            const currentOptions = Array.from(playlistSelect.querySelectorAll('option')).filter(o => o.value !== "");
            if (currentOptions.length <= 1) return;

            let currentIndex = currentOptions.findIndex(o => o.value === playlistSelect.value);
            let prevIndex = currentIndex - 1;
            if (prevIndex < 0) {
                prevIndex = currentOptions.length - 1; 
            }

            const prevTrackUrl = currentOptions[prevIndex].value;
            currentRadioStation = null;
            lastPlayerTrackUrl = prevTrackUrl;
            playlistSelect.value = prevTrackUrl;
            currentPlayingUrl = prevTrackUrl;
            localStorage.setItem('lastM3UTrack', prevTrackUrl);
            localStorage.removeItem('lastM3UTime');

            skipAttempts = 0;
            resetTimersToSelected();
            playMedia(prevTrackUrl, 0, true);
        }

        const touchContainer = document.querySelector('.media-wrapper');
        const mobPrevBtn = document.getElementById('mobilePrevBtn');
        const mobNextBtn = document.getElementById('mobileNextBtn');

        function updateMediaSessionMetadata() {
            if (!navigator.mediaSession || typeof MediaMetadata === 'undefined') return;
            const currentTrack = playlistTracks.find(track => track.url === currentPlayingUrl);
            navigator.mediaSession.metadata = new MediaMetadata({
                title: currentRadioStation ? currentRadioStation.name : currentTrack ? currentTrack.title : 'AgM3U Player',
                artist: 'AgM3U'
            });
        }

        function updateCurrentStreamInfo() {
            const currentTrack = playlistTracks.find(track => track.url === currentPlayingUrl);
            const streamName = currentRadioStation ? currentRadioStation.name : currentTrack ? currentTrack.title : '';
            currentStreamInfo.textContent = streamName || 'Kein Stream ausgewählt';
            currentStreamInfo.title = streamName ? `Wiedergabe umschalten: ${streamName}` : 'Kein Stream ausgewählt';
        }

        function updatePlaybackButton() {
            updateCurrentStreamInfo();
            updatePlaylistOptionHighlight();
            const canPlay = Boolean(activePlayer && currentPlayingUrl);
            const isPlaying = canPlay && !activePlayer.paused && !activePlayer.ended;
            const label = isPlaying ? 'Wiedergabe stoppen' : 'Wiedergabe starten';
            currentStreamInfo.disabled = !canPlay;
            currentStreamInfo.classList.toggle('is-playing', isPlaying);
            currentStreamInfo.setAttribute('aria-label', `${label}${currentStreamInfo.textContent ? `: ${currentStreamInfo.textContent}` : ''}`);
            currentStreamInfo.setAttribute('aria-pressed', String(isPlaying));
            if (navigator.mediaSession) {
                navigator.mediaSession.playbackState = isPlaying ? 'playing' : canPlay ? 'paused' : 'none';
            }
            updateRadioStationButtons();
        }

        function updatePlaylistOptionHighlight() {
            const rememberedTrackUrl = playlistTracks.some(track => track.url === lastPlayerTrackUrl)
                ? lastPlayerTrackUrl
                : '';
            const isPlaying = Boolean(rememberedTrackUrl && !currentRadioStation &&
                currentPlayingUrl === rememberedTrackUrl && activePlayer && !activePlayer.paused && !activePlayer.ended);
            playlistListView.querySelectorAll('.playlist-track').forEach(button => {
                const isCurrent = Boolean(rememberedTrackUrl && button.dataset.streamUrl === rememberedTrackUrl);
                button.classList.toggle('is-playing', isCurrent && isPlaying);
                button.classList.toggle('is-paused', isCurrent && !isPlaying);
                button.setAttribute('aria-pressed', String(isCurrent));
            });
        }

        function startCurrentStream() {
            if (!activePlayer || !currentPlayingUrl) return;
            const playRequest = activePlayer.play();
            if (playRequest) {
                playRequest.then(updatePlaybackButton).catch(error => {
                    updatePlaybackButton();
                    playbackStatus.textContent = `Wiedergabe konnte nicht gestartet werden: ${error.message}`;
                    playbackStatus.classList.add('show');
                });
            }
        }

        function stopCurrentStream() {
            if (!activePlayer) return;
            activePlayer.pause();
            try { activePlayer.currentTime = 0; } catch (err) {}
            if (!currentRadioStation) localStorage.removeItem('lastM3UTime');
            updatePlaybackButton();
        }

        function toggleCurrentStream() {
            if (!activePlayer || !currentPlayingUrl) return;
            if (activePlayer.paused || activePlayer.ended) startCurrentStream();
            else stopCurrentStream();
        }

        function setupMediaSession() {
            if (!navigator.mediaSession) return;
            const handlers = {
                play: startCurrentStream,
                pause: stopCurrentStream,
                stop: stopCurrentStream,
                nexttrack: function() {
                    skipAttempts = 0;
                    switchToNextStream();
                },
                previoustrack: switchToPrevStream
            };
            Object.entries(handlers).forEach(([action, handler]) => {
                try { navigator.mediaSession.setActionHandler(action, handler); } catch (err) {}
            });
        }

        let touchStartX = 0;
        let touchStartY = 0;

        if (touchContainer) {
            touchContainer.addEventListener('touchstart', function(e) {
                touchStartX = e.changedTouches.screenX;
                touchStartY = e.changedTouches.screenY;
                touchContainer.classList.add('touch-active');
            }, { passive: true });

            touchContainer.addEventListener('touchend', function(e) {
                const touchEndX = e.changedTouches.screenX;
                const touchEndY = e.changedTouches.screenY;

                setTimeout(() => {
                    touchContainer.classList.remove('touch-active');
                }, 1500);

                const diffX = touchEndX - touchStartX;
                const diffY = touchEndY - touchStartY;

                if (Math.abs(diffX) > 60 && Math.abs(diffY) < 40) {
                    if (diffX > 0) {
                        switchToPrevStream();
                    } else {
                        skipAttempts = 0;
                        switchToNextStream();
                    }
                }
            }, { passive: true });
        }

        if (mobPrevBtn) {
            mobPrevBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                switchToPrevStream();
            });
        }
        if (mobNextBtn) {
            mobNextBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                skipAttempts = 0;
                switchToNextStream();
            });
        }
        currentStreamInfo.addEventListener('click', toggleCurrentStream);
        setupMediaSession();
    </script>
</body>
</html>
